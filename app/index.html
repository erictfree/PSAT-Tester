<title>PSAT Math Coach</title>
<meta name="description" content="One PSAT math question at a time, with spaced repetition by concept.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Zilla+Slab:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --ground:#F3F6F9;
  --grid:rgba(36,71,184,.055);
  --paper:#FFFFFF;
  --ink:#1B2433;
  --ink-2:#4A5568;
  --ink-3:#6F7A8C;
  --rule:#D9E0E8;
  --rule-2:#E8EDF2;
  --accent:#2447B8;
  --accent-ink:#FFFFFF;
  --accent-soft:#E6ECFB;
  --pencil:#E0A526;
  --pencil-soft:#FBF1D9;
  --pencil-ink:#7A5306;
  --good:#1E7F4F;
  --good-soft:#E3F3EA;
  --bad:#C23B3B;
  --bad-soft:#FBE7E7;
  --fig-bg:#FFFFFF;
  --shadow:0 1px 2px rgba(27,36,51,.06),0 4px 16px rgba(27,36,51,.05);
  --display:"Zilla Slab",Rockwell,"Roboto Slab",Georgia,serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#10141B;--grid:rgba(124,155,255,.045);--paper:#181E28;--ink:#E6E9EE;--ink-2:#B5BDCA;--ink-3:#8791A2;
    --rule:#2A3342;--rule-2:#222A37;--accent:#7C9BFF;--accent-ink:#0E1422;--accent-soft:#1E2A4D;
    --pencil:#F0B840;--pencil-soft:#3A2F17;--pencil-ink:#F5CD72;--good:#4CC38A;--good-soft:#16301F;--bad:#F07575;--bad-soft:#3A1C1E;
    --fig-bg:#F4F6F9;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#10141B;--grid:rgba(124,155,255,.045);--paper:#181E28;--ink:#E6E9EE;--ink-2:#B5BDCA;--ink-3:#8791A2;
  --rule:#2A3342;--rule-2:#222A37;--accent:#7C9BFF;--accent-ink:#0E1422;--accent-soft:#1E2A4D;
  --pencil:#F0B840;--pencil-soft:#3A2F17;--pencil-ink:#F5CD72;--good:#4CC38A;--good-soft:#16301F;--bad:#F07575;--bad-soft:#3A1C1E;
  --fig-bg:#F4F6F9;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);font:15px/1.6 var(--body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 64px}

/* top bar */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
header.top .in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font:700 20px/1 var(--display);letter-spacing:.01em;display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand small{font:500 12px/1 var(--body);color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
nav.tabs{display:flex;gap:4px;background:var(--rule-2);padding:3px;border-radius:10px}
nav.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:8px;font-weight:600;font-size:14px;color:var(--ink-2)}
nav.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.savechip{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.savechip i{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}
.savechip.local i{background:var(--pencil)}
.savechip.err i{background:var(--bad)}

/* session strip */
.strip{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin:18px 0 12px;font-size:13px;color:var(--ink-2)}
.strip b{font:600 15px var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.strip .sp{margin-left:auto;display:flex;gap:8px}
.tool{border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600;color:var(--ink-2);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.tool:hover{border-color:var(--accent);color:var(--accent)}

/* question card */
.card{background:var(--paper);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow)}
.q{padding:22px 24px 24px}
.qmeta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:14px;font-size:12.5px;color:var(--ink-3)}
.qmeta .dom{font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:11.5px;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.02em;border:1px solid transparent}
.pill.new{background:var(--accent-soft);color:var(--accent)}
.pill.review{background:var(--good-soft);color:var(--good)}
.pill.relearn{background:var(--pencil-soft);color:var(--pencil-ink)}
.pill.ahead{background:var(--rule-2);color:var(--ink-2)}
.pill.diff{background:transparent;border-color:var(--rule);color:var(--ink-3)}
.timer{margin-left:auto;font:600 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.timer svg{width:18px;height:18px}
.timer.over{color:var(--pencil-ink)}
.prompt{font-size:16.5px;line-height:1.65;max-width:65ch}
.prompt p{margin:0 0 .7em}
.prompt table,.choice table,.expl table{border-collapse:collapse;margin:.6em 0;font-variant-numeric:tabular-nums}
.prompt th,.prompt td,.choice th,.choice td,.expl th,.expl td{border:1px solid var(--rule);padding:4px 12px;text-align:center}
.prompt th,.expl th,.choice th{background:var(--rule-2);font-weight:600}
.tblwrap{overflow-x:auto}
figure.fig{margin:14px 0;display:flex;justify-content:center}
figure.fig img{max-width:min(100%,460px);background:var(--fig-bg);border-radius:8px;padding:6px}
figure.fig .svgbox{width:100%;max-width:440px;color:var(--ink)}
figure.fig .svgbox svg{width:100%;height:auto;display:block}
mjx-container{font-size:105%!important}
mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden}

/* answers */
.choices{display:grid;gap:10px;margin-top:18px}
.choice{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--rule);background:var(--paper);border-radius:12px;padding:12px 14px;transition:border-color .12s,background .12s}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice .bub{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink-3);display:grid;place-items:center;font:600 13px var(--mono);color:var(--ink-2);margin-top:1px}
.choice .ct{flex:1;min-width:0;padding-top:2px;overflow-x:auto}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.choice[aria-pressed="true"] .bub{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.choice.is-right{border-color:var(--good);background:var(--good-soft)}
.choice.is-right .bub{background:var(--good);border-color:var(--good);color:#fff}
.choice.is-wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.is-wrong .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.choice:disabled{cursor:default}

.gridin{margin-top:20px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px}
.gridin label{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.gridin input{font:600 26px var(--mono);letter-spacing:.18em;width:9.5ch;padding:8px 12px;border:1.5px solid var(--ink-3);border-radius:10px;background:var(--paper);text-align:center}
.gridin input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.gridin .hint{font-size:12.5px;color:var(--ink-3);max-width:38ch;line-height:1.45}
.gridin.is-right input{border-color:var(--good);background:var(--good-soft)}
.gridin.is-wrong input{border-color:var(--bad);background:var(--bad-soft)}

.actions{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:11px 20px;font-weight:700;font-size:15px;background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--rule)}
.btn.ghost:hover{border-color:var(--ink-3)}
.kbd{font:500 12px var(--mono);color:var(--ink-3)}

/* feedback */
.fb{margin-top:18px;border-top:1px dashed var(--rule);padding-top:18px}
.verdict{display:flex;align-items:center;gap:10px;font:700 20px/1.2 var(--display)}
.verdict .mark{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.verdict.good{color:var(--good)} .verdict.good .mark{background:var(--good)}
.verdict.bad{color:var(--bad)} .verdict.bad .mark{background:var(--bad)}
.verdict .sub{font:400 13.5px var(--body);color:var(--ink-2)}
.expl{margin-top:12px;background:var(--rule-2);border-radius:10px;padding:14px 16px;font-size:14.5px;line-height:1.65;max-width:none}
.expl p{margin:0 0 .6em}.expl p:last-child{margin:0}
.rate{margin-top:16px}
.rate h3{margin:0 0 4px;font:600 15px var(--body)}
.rate p{margin:0 0 10px;font-size:13px;color:var(--ink-3)}
.rate .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.rate .opts button{border:1.5px solid var(--rule);background:var(--paper);border-radius:10px;padding:9px 10px;text-align:left;line-height:1.3}
.rate .opts button b{display:block;font-size:14px}
.rate .opts button span{font-size:12px;color:var(--ink-3)}
.rate .opts button:hover{border-color:var(--accent)}
.rate .opts button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.nextinfo{font-size:13px;color:var(--ink-2);margin-top:12px}

/* reference sheet */
details.ref{margin-top:14px}
details.ref summary{list-style:none}
details.ref summary::-webkit-details-marker{display:none}
.refbody{margin-top:10px;padding:16px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 22px;font-size:14px}
.refbody div b{display:block;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.refnote{grid-column:1/-1;font-size:13px;color:var(--ink-2);border-top:1px solid var(--rule-2);padding-top:10px}

/* empty / notice */
.notice{padding:26px 26px}
.notice h2{margin:0 0 6px;font:700 24px/1.2 var(--display);text-wrap:balance}
.notice p{margin:0 0 12px;color:var(--ink-2);max-width:60ch}
.notice ul{margin:6px 0 16px;padding-left:18px;color:var(--ink-2);font-size:14px}
.banner{margin:14px 0 0;padding:10px 14px;border-radius:10px;background:var(--pencil-soft);color:var(--pencil-ink);font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.banner b{font-weight:700}

/* progress */
h2.sec{font:700 22px/1.2 var(--display);margin:30px 0 12px}
h2.sec:first-child{margin-top:22px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{padding:14px 16px}
.tile .k{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.tile .v{font:600 28px/1.15 var(--mono);font-variant-numeric:tabular-nums;margin-top:4px}
.tile .s{font-size:12.5px;color:var(--ink-3)}
.chartcard{padding:16px 18px 10px;position:relative}
.chartcard h3{margin:0;font:600 14px var(--body)}
.chartcard .cap{font-size:12.5px;color:var(--ink-3);margin:2px 0 8px}
.chartcard svg{width:100%;height:auto;display:block;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;padding:6px 9px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-8px}
.dom-block{margin-top:14px}
.dom-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.dom-head h3{margin:0;font:600 16px var(--body)}
.dom-head span{font-size:13px;color:var(--ink-3)}
.tblx{overflow-x:auto}
table.skills{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
table.skills th{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule)}
table.skills td{padding:9px 10px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
table.skills tr:last-child td{border-bottom:0}
table.skills td.n{font-family:var(--mono);font-size:13px;white-space:nowrap}
.accbar{display:flex;align-items:center;gap:8px;min-width:120px}
.accbar .track{flex:1;height:6px;border-radius:3px;background:var(--rule-2);overflow:hidden}
.accbar .fill{height:100%;background:var(--accent);border-radius:3px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap}
.st i{width:8px;height:8px;border-radius:2px;display:inline-block}
.st.solid{color:var(--good)} .st.solid i{background:var(--good)}
.st.building{color:var(--accent)} .st.building i{background:var(--accent)}
.st.shaky{color:var(--pencil-ink)} .st.shaky i{background:var(--pencil)}
.st.learning{color:var(--bad)} .st.learning i{background:var(--bad)}
.st.none{color:var(--ink-3)} .st.none i{background:var(--rule)}
.muted{color:var(--ink-3)}

/* log */
.logtools{display:flex;gap:10px;align-items:center;margin:22px 0 10px;flex-wrap:wrap}
.logtools h2{margin:0 auto 0 0;font:700 22px/1.2 var(--display)}
.logtools select{font:inherit;font-size:13px;border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:5px 8px}
.logrow{border-bottom:1px solid var(--rule-2)}
.logrow:last-child{border-bottom:0}
.logrow>button{width:100%;border:0;background:transparent;text-align:left;display:grid;grid-template-columns:20px 1fr auto;gap:4px 12px;align-items:center;padding:11px 16px}
.logrow>button:hover{background:var(--rule-2)}
.logrow .res{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#fff}
.logrow .res.good{background:var(--good)}.logrow .res.bad{background:var(--bad)}
.logrow .t1{font-size:14px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logrow .t2{grid-column:2/4;font-size:12.5px;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap}
.logrow .when{font:500 12px var(--mono);color:var(--ink-3);white-space:nowrap}
.logdetail{padding:4px 16px 18px 48px}
.logdetail .you{font-size:13.5px;margin:8px 0}
.empty{padding:28px 20px;text-align:center;color:var(--ink-3)}
.loading{padding:60px 20px;text-align:center;color:var(--ink-3)}
@media (max-width:520px){
  .q{padding:18px 16px 20px}
  .prompt{font-size:16px}
  .strip .sp{margin-left:0}
  .logdetail{padding-left:16px}
  header.top .in{gap:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="in">
    <div class="brand">PSAT Math Coach <small>Practice</small></div>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button role="tab" id="tab-practice" aria-selected="true" data-view="practice">Practice</button>
      <button role="tab" id="tab-progress" aria-selected="false" data-view="progress">Progress</button>
      <button role="tab" id="tab-log" aria-selected="false" data-view="log">Log</button>
    </nav>
    <span class="savechip" id="savechip" title="Where your progress is saved"><i></i><span>Connecting…</span></span>
  </div>
</header>

<main class="wrap">
  <section id="view-practice"><div class="loading">Loading questions…</div></section>
  <section id="view-progress" hidden></section>
  <section id="view-log" hidden></section>
</main>

  svg: { fontCache: "global" },
  options: { enableMenu: false },
  startup: {
    typeset: false,
    ready() {
      MathJax.startup.defaultReady();
      MathJax.startup.promise.then(() => { window.__mjReady = true; (window.__mjQueue || []).splice(0).forEach(el => typeset(el)); });
    }
  }
};
function typeset(el) {
  if (!el) return;
  if (!window.__mjReady) { (window.__mjQueue = window.__mjQueue || []).push(el); return; }
  MathJax.typesetPromise([el]).catch(() => {});
}
</script>

  let db = null;
  for (let i = 0; i < 20 && !(window.claude && window.claude.use); i++) await new Promise(r => setTimeout(r, 50));
  try { if (window.claude && window.claude.use) db = await window.claude.use("db"); } catch (e) { db = null; }
  const queues = {};
  const serial = (key, fn) => (queues[key] = (queues[key] || Promise.resolve()).catch(() => {}).then(fn));
  if (db) {
    const retry = async fn => { try { return await fn(); } catch (e) { if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 400 + Math.random() * 600)); return fn(); } throw e; } };
    return {
      kind: "db",
      async getState() { const s = await retry(() => db.doc("progress/state").get()); return s.exists ? clone(s.data()) : null; },
      putState(st) { const body = clone(st); return serial("state", () => retry(() => db.doc("progress/state").set(body))); },
      async getLog(i) { const s = await retry(() => db.doc("logs/c" + i).get()); return s.exists ? clone(s.data().entries || []) : []; },
      putLog(i, entries) { const body = { entries: clone(entries) }; return serial("log" + i, () => retry(() => db.doc("logs/c" + i).set(body))); },
    };
  }
  const ls = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  return {
    kind: "local",
    async getState() { return ls.get("psat.state"); },
    async putState(st) { ls.set("psat.state", st); },
    async getLog(i) { return ls.get("psat.log." + i) || []; },
    async putLog(i, entries) { ls.set("psat.log." + i, entries); },
  };
}

/* ------------------------------------------------------------------ */
/* Question bank                                                       */
/* ------------------------------------------------------------------ */
const BANK = { byId: {}, fam: {}, famOrder: [] };
async function loadBank() {
  const idx = await (await fetch("questions/index.json", { cache: "no-cache" })).json();
  const packs = await Promise.all(idx.packs.map(p => fetch("questions/" + p, { cache: "no-cache" }).then(r => r.json()).catch(() => ({ questions: [] }))));
  for (const pack of packs) for (const q of pack.questions || []) {
    if (!SKILLS[q.skill]) continue;
    BANK.byId[q.id] = q;
    (BANK.fam[q.family] = BANK.fam[q.family] || []).push(q);
  }
  for (const f in BANK.fam) BANK.fam[f].sort((a, b) => a.variant - b.variant);
  BANK.famOrder = Object.keys(BANK.fam);
}
const famHead = fid => BANK.fam[fid][0];

/* ------------------------------------------------------------------ */
/* State                                                               */
/* ------------------------------------------------------------------ */
let store, S, LOG = [];
function freshState() {
  return { v: 1, created: Date.now(), counter: 0, logCount: 0, sinceNew: 0, fams: {}, cur: null, pend: null, lastFid: null, lastSkill: null };
}
async function loadLog() {
  const n = Math.ceil((S.logCount || 0) / LOG_CHUNK);
  const chunks = await Promise.all(Array.from({ length: n }, (_, i) => store.getLog(i)));
  LOG = chunks.flat();
}
let saveTimer;
function setChip(kind, text) {
  const c = $("#savechip"); c.className = "savechip" + (kind ? " " + kind : ""); c.lastElementChild.textContent = text;
}
async function persist(logIdx) {
  try {
    const jobs = [store.putState(S)];
    if (logIdx != null) {
      const ci = Math.floor(logIdx / LOG_CHUNK);
      jobs.push(store.putLog(ci, LOG.slice(ci * LOG_CHUNK, (ci + 1) * LOG_CHUNK)));
    }
    await Promise.all(jobs);
    if (store.kind === "db") setChip("", "Saved");
  } catch (e) {
    setChip("err", "Not saved. Check your connection");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => persist(logIdx), 5000);
  }
}

/* ------------------------------------------------------------------ */
/* Scheduler                                                           */
/*                                                                     */
/* Scheduling happens per concept family. Every family has an original */
/* question and variants that test the same concept with different     */
/* numbers and scenarios. A question is never shown twice: each return */
/* visit to a concept serves an unseen variant.                        */
/*   - New concept: introduced easiest first, rotating across skills.  */
/*   - Miss: the concept comes back after 3 other questions (5 for a   */
/*     careless slip) with a fresh variant, until answered correctly.  */
/*   - Correct: the student's rating sets the next spaced gap, which   */
/*     grows with each success and shrinks for concepts that have      */
/*     proved hard (difficulty D, 1-10, drifts back toward 5).         */
/* ------------------------------------------------------------------ */
const unseen = fid => { const seen = (S.fams[fid] && S.fams[fid].seen) || []; return BANK.fam[fid].filter(q => !seen.includes(q.id)); };
const isDue = (f, now) => f && ((f.st === "learn" && f.dueN <= S.counter) || (f.st === "review" && f.due <= now + 3 * 3600000));

function schedule(prev, q, correct, rating, now) {
  const f = prev ? clone(prev) : { st: "new", D: [0, 3, 5, 7][q.difficulty] || 5, S: 0, due: 0, dueN: null, seen: [], n: 0, c: 0, lapses: 0, last: 0 };
  if (!f.seen.includes(q.id)) f.seen.push(q.id);
  f.n++;
  const lastBefore = f.last;
  f.last = now;
  if (!correct) {
    const slip = rating === "slip";
    f.lapses++;
    f.D = clamp(f.D + (slip ? 0.5 : 1.5), 1, 10);
    f.S = Math.max(1, (f.S || 1) * (slip ? 0.7 : 0.4));
    f.st = "learn"; f.dueN = S.counter + 1 + (slip ? 5 : 3); f.due = 0;
    return f;
  }
  f.c++;
  if (rating === "guess") {
    f.D = clamp(f.D + 1, 1, 10);
    f.S = Math.max(1, (f.S || 1) * 0.6);
    f.st = "learn"; f.dueN = S.counter + 1 + 4; f.due = 0;
    return f;
  }
  const oldD = f.D;
  f.D = rating === "hard" ? clamp(f.D + 0.5, 1, 10) : rating === "easy" ? clamp(f.D - 1, 1, 10) : f.D + (5 - f.D) * 0.2;
  let days;
  if (f.st === "new") days = { hard: 1, good: 2, easy: 4 }[rating];
  else if (f.st === "learn") days = { hard: 1, good: Math.max(1, f.S), easy: Math.max(2, f.S * 1.5) }[rating];
  else {
    const mult = clamp((11 - oldD) / 6, 0.3, 1.6);
    const growth = { hard: 1.2, good: 2.5, easy: 3.5 }[rating];
    const elapsed = lastBefore ? (now - lastBefore) / DAY : f.S;
    const base = Math.max(f.S, Math.min(elapsed, f.S * 2));
    days = Math.max(f.S + (rating === "hard" ? 0.5 : 1), base * (1 + (growth - 1) * mult));
  }
  f.S = clamp(days, 1, 60);
  f.st = "review"; f.due = now + f.S * DAY; f.dueN = null;
  return f;
}

function pickVariant(fid, mode) {
  const u = unseen(fid);
  if (!u.length) return null;
  if (mode === "new") return u.find(q => q.variant === 0) || u[0];
  return u.find(q => q.variant > 0) || u[0];
}

function pickNext(allowAhead) {
  const now = Date.now();
  const fids = BANK.famOrder;
  const avoid = fid => fid === S.lastFid;
  const skillOf = fid => famHead(fid).skill;
  const byPref = list => list.filter(f => !avoid(f)).concat(list.filter(avoid));

  const relearn = byPref(fids.filter(f => S.fams[f] && S.fams[f].st === "learn" && S.fams[f].dueN <= S.counter && unseen(f).length)
    .sort((a, b) => S.fams[a].dueN - S.fams[b].dueN));
  const review = fids.filter(f => S.fams[f] && S.fams[f].st === "review" && S.fams[f].due <= now + 3 * 3600000 && unseen(f).length)
    .sort((a, b) => ((now - S.fams[b].last) / S.fams[b].S) - ((now - S.fams[a].last) / S.fams[a].S));
  const fresh = fids.filter(f => !S.fams[f] && BANK.fam[f].length);

  if (relearn.length && !(relearn[0] === S.lastFid && (review.length || fresh.length))) return { fid: relearn[0], mode: "relearn" };

  const pickNew = () => {
    const started = {};
    for (const f in S.fams) { const k = BANK.fam[f] ? skillOf(f) : null; if (k) started[k] = (started[k] || 0) + 1; }
    const scored = fresh.map(f => ({ f, d: famHead(f).difficulty, s: started[skillOf(f)] || 0, same: skillOf(f) === S.lastSkill ? 1 : 0, r: hash(f + S.created) }));
    scored.sort((a, b) => a.d - b.d || a.same - b.same || a.s - b.s || a.r - b.r);
    return scored.length ? { fid: scored[0].f, mode: "new" } : null;
  };
  const pickReview = () => {
    const list = review.filter(f => skillOf(f) !== S.lastSkill);
    const f = (list.length ? list : review)[0];
    return f ? { fid: f, mode: "review" } : null;
  };
  if (review.length && fresh.length && S.sinceNew >= 4) return pickNew();
  if (review.length) return pickReview();
  if (fresh.length) return pickNew();
  if (relearn.length) return { fid: relearn[0], mode: "relearn" };

  const early = fids.filter(f => S.fams[f] && S.fams[f].st === "learn" && unseen(f).length).sort((a, b) => S.fams[a].dueN - S.fams[b].dueN);
  if (early.length) return { fid: early[0], mode: "relearn" };
  if (allowAhead) {
    const ahead = fids.filter(f => S.fams[f] && S.fams[f].st === "review" && unseen(f).length).sort((a, b) => S.fams[a].due - S.fams[b].due);
    if (ahead.length) return { fid: ahead[0], mode: "ahead" };
  }
  return null;
}
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

function bankStatus() {
  const now = Date.now();
  const fids = BANK.famOrder;
  const blocked = fids.filter(f => isDue(S.fams[f], now) && !unseen(f).length);
  const unstarted = fids.filter(f => !S.fams[f]).length;
  const unusedQ = fids.reduce((n, f) => n + unseen(f).length, 0);
  const upcoming = fids.filter(f => S.fams[f] && S.fams[f].st === "review" && unseen(f).length).map(f => S.fams[f].due).sort((a, b) => a - b)[0];
  const lowFams = fids.filter(f => S.fams[f] && unseen(f).length <= 1);
  return { blocked, unstarted, unusedQ, upcoming, lowFams };
}

/* ------------------------------------------------------------------ */
/* Answer checking                                                     */
/* ------------------------------------------------------------------ */
function parseNum(s) {
  s = String(s).trim().replace(/\s+/g, "").replace(/^\+/, "");
  if (!s) return null;
  let m = s.match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/);
  if (m) { const b = Number(m[2]); return b ? Number(m[1]) / b : null; }
  if (/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return Number(s);
  return null;
}
function isCorrect(q, resp) {
  if (q.type === "mc") return resp === q.answer;
  const v = parseNum(resp);
  if (v == null) return false;
  const r = String(resp).trim();
  // PSAT rule: a decimal that fills the answer box (5 characters, 6 with a minus sign) may be truncated or rounded.
  const fullDecimal = r.includes(".") && !r.includes("/") && r.length >= (r.startsWith("-") ? 6 : 5);
  const step = fullDecimal ? Math.pow(10, -(r.length - r.indexOf(".") - 1)) : 0;
  return q.answer.some(a => {
    const t = parseNum(a);
    if (t == null) return false;
    if (Math.abs(t - v) <= 1e-9 * Math.max(1, Math.abs(t))) return true;
    return fullDecimal && Math.abs(t - v) < step - 1e-12;
  });
}
const answerText = q => q.type === "mc" ? q.answer : q.answer[0];

const V = { practice: $("#view-practice"), progress: $("#view-progress"), log: $("#view-log") };
let tick, shownAt, selected = null;

const MODE_LABEL = { new: ["new", "New concept"], review: ["review", "Spaced review"], relearn: ["relearn", "Try again: new version"], ahead: ["ahead", "Practice ahead"] };

function figureHtml(q) {
  if (!q.figure) return "";
  const alt = esc(q.figure.alt || "Figure");
  if (q.figure.img) return `<figure class="fig"><img src="${esc(q.figure.img)}" alt="${alt}"></figure>`;
  if (q.figure.svg) return `<figure class="fig"><div class="svgbox" role="img" aria-label="${alt}">${q.figure.svg}</div></figure>`;
  return "";
}
function wrapTables(html) { return String(html).replace(/<table/g, '<div class="tblwrap"><table').replace(/<\/table>/g, "</table></div>"); }

function stripHtml() {

  const today = LOG.filter(e => dayKey(e.t) === dayKey(Date.now()));

}

function refSheet() {

    <div><b>45°-45°-90°</b>sides \\(s,\\ s,\\ s\\sqrt2\\)</div>
    <div><b>Rectangular prism</b>\\(V=\\ell wh\\)</div>
    <div><b>Cylinder</b>\\(V=\\pi r^2h\\)</div>

  </div></details>`;

function renderPractice() {
  clearInterval(tick);
  if (S.pend && BANK.byId[S.pend.qid]) return renderQuestion(BANK.byId[S.pend.qid], S.pend.mode, true);
  if (S.cur && BANK.byId[S.cur.qid] && !(S.fams[BANK.byId[S.cur.qid].family] || { seen: [] }).seen.includes(S.cur.qid)) {
    return renderQuestion(BANK.byId[S.cur.qid], S.cur.mode, false);
  }
  nextQuestion(false);
}

function nextQuestion(allowAhead) {
  const pick = pickNext(allowAhead);
  if (!pick) { S.cur = null; persist(); return renderOut(); }
  const q = pickVariant(pick.fid, pick.mode);
  S.cur = { qid: q.id, mode: pick.mode, shownAt: Date.now() };
  persist();
  renderQuestion(q, pick.mode, false);
}

function renderOut() {
  const b = bankStatus();
  const blockedList = b.blocked.map(f => { const h = famHead(f); return `<li>${esc(SKILLS[h.skill][1])} <span class="muted">(${esc(h.source)})</span></li>`; }).join("");
  const canAhead = BANK.famOrder.some(f => S.fams[f] && S.fams[f].st === "review" && unseen(f).length);
  V.practice.innerHTML = stripHtml() + `<div class="card notice">
    <h2>You need more questions loaded</h2>
    <p>You've worked through every question available right now. Ask for more PSAT math questions to be loaded so you can keep going.</p>
    ${blockedList ? `<p><b>These concepts are due for review but have no unused versions left:</b></p><ul>${blockedList}</ul>` : ""}
    ${b.upcoming ? `<p>Your next scheduled review is ${fmtIn(b.upcoming - Date.now())} (${fmtWhen(b.upcoming)}). Come back then, or practice a review early.</p>` : ""}
    <div class="actions">${canAhead ? `<button class="btn" id="ahead">Practice a review early</button>` : ""}<button class="btn ghost" id="toprog">See your progress</button></div>
  </div>`;
  $("#ahead") && ($("#ahead").onclick = () => nextQuestion(true));
  $("#toprog").onclick = () => show("progress");
}

function renderQuestion(q, mode, answered) {
  const [mcls, mlabel] = MODE_LABEL[mode] || MODE_LABEL.new;
  const sk = SKILLS[q.skill];
  const b = bankStatus();
  const lowBanner = !answered && b.unusedQ <= 10 ? `<div class="banner"><b>Running low.</b> Only ${b.unusedQ} unused questions are left. Ask for more questions to be loaded soon.</div>` : "";
  const choices = q.type === "mc"
    ? `<div class="choices" role="group" aria-label="Answer choices">${q.choices.map((c, i) => { const L = "ABCD"[i]; return `<button class="choice" id="ch-${L}" data-l="${L}" aria-pressed="false"><span class="bub">${L}</span><span class="ct">${wrapTables(c)}</span></button>`; }).join("")}</div>`
    : `<div class="gridin"><div><label for="spr">Your answer</label><input id="spr" inputmode="decimal" autocomplete="off" spellcheck="false" maxlength="6" placeholder="     "></div>
       <div class="hint">Type a number, a decimal, or a fraction like 7/2. Up to 5 characters, or 6 with a minus sign. No % or $ signs.</div></div>`;
  V.practice.innerHTML = stripHtml() + `<article class="card q" id="qcard">
    <div class="qmeta">
      <span class="dom">${esc(DOMAINS[sk[0]])}</span><span>${esc(sk[1])}</span>
      <span class="pill ${mcls}">${mlabel}</span><span class="pill diff">${DIFF[q.difficulty]}</span>
      <span class="timer" id="timer" title="Test pace is 1:35 per question"></span>
    </div>
    <div class="prompt" id="prompt">${figureHtml(q)}${wrapTables(q.prompt)}</div>
    ${choices}
    <div class="actions" id="actions">${answered ? "" : `<button class="btn" id="submit" disabled>Check answer</button><span class="kbd" id="kbdhint">${q.type === "mc" ? "Keys A–D, then Enter" : "Enter to check"}</span>`}</div>
    <div id="fb"></div>
  </article>${lowBanner}${refSheet()}`;
  typeset($("#qcard"));
  typeset($(".refbody"));
  selected = null;

  if (answered) { restoreAnswered(q); return; }

  shownAt = S.cur && S.cur.qid === q.id && S.cur.shownAt && Date.now() - S.cur.shownAt < 20 * 60000 ? S.cur.shownAt : Date.now();
  startTimer();
  const submit = $("#submit");
  if (q.type === "mc") {
    V.practice.querySelectorAll(".choice").forEach(btn => btn.onclick = () => {
      V.practice.querySelectorAll(".choice").forEach(x => x.setAttribute("aria-pressed", "false"));
      btn.setAttribute("aria-pressed", "true"); selected = btn.dataset.l; submit.disabled = false;
    });
  } else {
    const inp = $("#spr");
    inp.oninput = () => {
      inp.value = inp.value.replace(/[^0-9./-]/g, "");
      const max = inp.value.startsWith("-") ? 6 : 5;
      if (inp.value.length > max) inp.value = inp.value.slice(0, max);
      selected = inp.value.trim() || null;
      submit.disabled = parseNum(inp.value) == null;
    };
    setTimeout(() => inp.focus({ preventScroll: true }), 50);
  }
  submit.onclick = () => submitAnswer(q, mode);
}

function startTimer() {
  const el = $("#timer");
  const draw = () => {
    const s = (Date.now() - shownAt) / 1000;
    const frac = Math.min(1, s / PACE);
    const a = frac * 2 * Math.PI, x = 9 + 7 * Math.sin(a), y = 9 - 7 * Math.cos(a);
    const arc = frac >= 1 ? `<circle cx="9" cy="9" r="7" fill="currentColor" opacity=".35"/>` : `<path d="M9 9 L9 2 A7 7 0 ${frac > .5 ? 1 : 0} 1 ${x.toFixed(2)} ${y.toFixed(2)} Z" fill="currentColor" opacity=".35"/>`;
    el.innerHTML = `<svg viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7.5" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".6"/>${arc}</svg>${fmtSecs(s)}`;
    el.classList.toggle("over", s > PACE);
  };
  draw(); tick = setInterval(draw, 1000);
}

function submitAnswer(q, mode) {
  if (!selected) return;
  clearInterval(tick);
  const now = Date.now();
  const secs = Math.round((now - shownAt) / 1000);
  const ok = isCorrect(q, selected);
  const prev = clone(S.fams[q.family] || null);
  const rating = ok ? "good" : "miss";
  S.fams[q.family] = schedule(prev, q, ok, rating, now);
  S.counter++;
  S.sinceNew = mode === "new" ? 0 : (S.sinceNew || 0) + 1;
  S.lastFid = q.family; S.lastSkill = q.skill;
  const entry = { t: now, q: q.id, f: q.family, sk: q.skill, d: q.difficulty, m: mode, r: selected, ok, s: secs, rt: rating };
  LOG.push(entry);
  const logIdx = LOG.length - 1;
  S.logCount = LOG.length;
  S.pend = { qid: q.id, mode, resp: selected, ok, secs, prev, rating, logIdx, counter: S.counter - 1 };
  S.cur = null;
  persist(logIdx);
  restoreAnswered(q);
}

function restoreAnswered(q) {
  const p = S.pend;
  $("#actions").innerHTML = "";
  $("#timer").innerHTML = `${fmtSecs(p.secs)}`;
  $("#timer").classList.toggle("over", p.secs > PACE);
  if (q.type === "mc") {
    V.practice.querySelectorAll(".choice").forEach(btn => {
      btn.disabled = true;
      if (btn.dataset.l === q.answer) btn.classList.add("is-right");
      else if (btn.dataset.l === p.resp) btn.classList.add("is-wrong");
    });
  } else {
    const inp = $("#spr"); inp.value = p.resp; inp.disabled = true;
    inp.closest(".gridin").classList.add(p.ok ? "is-right" : "is-wrong");
  }
  const right = q.type === "mc" ? `The answer is <b>${q.answer}</b>.` : `Accepted answer${q.answer.length > 1 ? "s" : ""}: <b>${q.answer.map(esc).join(", ")}</b>.`;
  const opts = p.ok
    ? [["guess", "I guessed", "Show me this again soon"], ["hard", "Hard", "Got it, with effort"], ["good", "Good", "Solid, some thought"], ["easy", "Easy", "Knew it right away"]]
    : [["miss", "Didn't know how", "Show me a new version soon"], ["slip", "Careless mistake", "I knew the method"]];
  $("#fb").innerHTML = `<div class="fb">
    <div class="verdict ${p.ok ? "good" : "bad"}"><span class="mark">${p.ok ? CHECK : CROSS}</span><div>${p.ok ? "Correct" : "Not quite"}<div class="sub">${right} You took ${fmtSecs(p.secs)}${p.secs > PACE ? ", slower than the 1:35 test pace" : ""}.</div></div></div>
    <div class="expl prompt" id="expl">${wrapTables(q.explanation)}</div>
    <div class="rate">
      <h3>${p.ok ? "How did that feel?" : "What happened?"}</h3>
      <p>${p.ok ? "Your answer sets when this concept comes back." : "You'll get a new version of this concept after a few other questions."}</p>
      <div class="opts">${opts.map(([k, t, s]) => `<button data-r="${k}" aria-pressed="${p.rating === k}"><b>${t}</b><span>${s}</span></button>`).join("")}</div>
    </div>
    <div class="nextinfo" id="nextinfo"></div>
    <div class="actions"><button class="btn" id="next">Next question</button><span class="kbd">Enter</span></div>
  </div>`;
  typeset($("#fb"));
  $("#fb").querySelectorAll(".opts button").forEach(btn => btn.onclick = () => rate(q, btn.dataset.r));
  $("#next").onclick = () => { S.pend = null; nextQuestion(false); window.scrollTo({ top: 0, behavior: "smooth" }); };
  drawNextInfo(q);
}

function drawNextInfo(q) {
  const f = S.fams[q.family];
  const left = unseen(q.family).length;
  let txt;
  if (f.st === "learn") txt = `This concept comes back after ${Math.max(1, f.dueN - S.counter)} other question${f.dueN - S.counter === 1 ? "" : "s"}, as a new version.`;
  else txt = `Next review of this concept: ${fmtIn(f.due - Date.now())}.`;
  txt += left ? ` ${left} unused version${left === 1 ? "" : "s"} left.` : ` No unused versions left. Ask for more questions for this concept.`;
  $("#nextinfo").textContent = txt;
}

function rate(q, r) {
  const p = S.pend;
  if (!p || p.rating === r) return;
  const saved = S.counter;
  S.counter = p.counter; // reschedule relative to when the answer was given
  S.fams[q.family] = schedule(p.prev, q, p.ok, r, LOG[p.logIdx].t);
  S.counter = saved;
  p.rating = r;
  LOG[p.logIdx].rt = r;
  $("#fb").querySelectorAll(".opts button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.r === r)));
  drawNextInfo(q);
  persist(p.logIdx);
}

document.addEventListener("keydown", e => {
  if (V.practice.hidden || e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (e.key === "Enter") {
    const next = $("#next"), sub = $("#submit");
    if (next) { e.preventDefault(); next.click(); }
    else if (sub && !sub.disabled) { e.preventDefault(); sub.click(); }
    return;
  }
  if (tag === "input") return;
  const k = e.key.toUpperCase();
  if ("ABCD".includes(k) && k.length === 1) { const b = $("#ch-" + k); if (b && !b.disabled) b.click(); }
});

/* ------------------------------------------------------------------ */
/* Progress view                                                       */
/* ------------------------------------------------------------------ */
function skillStats() {
  const out = {};
  for (const k in SKILLS) out[k] = { n: 0, c: 0, recent: [], fams: 0, started: 0, learning: 0, left: 0 };
  for (const e of LOG) { const o = out[e.sk]; if (!o) continue; o.n++; if (e.ok) o.c++; o.recent.push(e.ok); }
  for (const f of BANK.famOrder) {
    const o = out[famHead(f).skill]; o.fams++; o.left += unseen(f).length;
    if (S.fams[f]) { o.started++; if (S.fams[f].st === "learn") o.learning++; }
  }
  for (const k in out) {
    const o = out[k], r = o.recent.slice(-6), rc = r.filter(Boolean).length;
    o.status = !o.n ? "none" : o.learning ? "learning" : (r.length >= 3 && rc / r.length >= 0.8) ? "solid" : (rc / r.length < 0.6 ? "shaky" : "building");
  }
  return out;
}
const STATUS = { none: "Not started", learning: "Relearning", shaky: "Shaky", building: "Building", solid: "Solid" };

function streakDays() {
  const days = new Set(LOG.map(e => dayKey(e.t)));
  let n = 0, t = Date.now();
  if (!days.has(dayKey(t))) t -= DAY;
  while (days.has(dayKey(t))) { n++; t -= DAY; }
  return n;
}

function renderProgress() {
  const n = LOG.length, c = LOG.filter(e => e.ok).length;
  const last50 = LOG.slice(-50), l50 = last50.filter(e => e.ok).length;
  const times = LOG.map(e => e.s).filter(s => s > 0 && s < 1200).sort((a, b) => a - b);
  const med = times.length ? times[Math.floor(times.length / 2)] : null;
  const now = Date.now();
  const due = BANK.famOrder.filter(f => isDue(S.fams[f], now)).length;
  const b = bankStatus();
  const st = skillStats();
  const totalFams = BANK.famOrder.length, startedFams = BANK.famOrder.filter(f => S.fams[f]).length;

  let html = `<h2 class="sec">Summary</h2><div class="tiles">
    <div class="card tile"><div class="k">Answered</div><div class="v">${n}</div><div class="s">${c} correct</div></div>
    <div class="card tile"><div class="k">Accuracy</div><div class="v">${n ? Math.round(100 * l50 / last50.length) + "%" : "—"}</div><div class="s">last ${last50.length || 0} questions</div></div>
    <div class="card tile"><div class="k">Day streak</div><div class="v">${streakDays()}</div><div class="s">days in a row</div></div>
    <div class="card tile"><div class="k">Median time</div><div class="v">${med != null ? fmtSecs(med) : "—"}</div><div class="s">test pace 1:35</div></div>
    <div class="card tile"><div class="k">Concepts</div><div class="v">${startedFams}<span style="font-size:16px;color:var(--ink-3)">/${totalFams}</span></div><div class="s">${due} due for review</div></div>
  </div>`;

  html += `<h2 class="sec">Daily practice</h2><div class="card chartcard" id="chart"><h3>Questions answered per day</h3><div class="cap">Last 21 days. Hover a bar for accuracy.</div><div id="chartsvg"></div></div>`;

  html += `<h2 class="sec">Skills</h2>`;
  for (const d in DOMAINS) {
    const ks = Object.keys(SKILLS).filter(k => SKILLS[k][0] === d);
    const dn = ks.reduce((a, k) => a + st[k].n, 0), dc = ks.reduce((a, k) => a + st[k].c, 0);
    html += `<div class="card dom-block"><div style="padding:14px 16px 4px" class="dom-head"><h3>${DOMAINS[d]}</h3><span>${dn ? Math.round(100 * dc / dn) + "% correct over " + dn + (dn === 1 ? " question" : " questions") : "Not started"}</span></div>
    <div class="tblx"><table class="skills"><thead><tr><th>Skill</th><th>Status</th><th>Accuracy</th><th>Concepts</th><th>Unused</th></tr></thead><tbody>
    ${ks.map(k => { const o = st[k]; const pct = o.n ? Math.round(100 * o.c / o.n) : null;
      return `<tr><td>${esc(SKILLS[k][1])}</td><td><span class="st ${o.status}"><i></i>${STATUS[o.status]}</span></td>
      <td>${pct == null ? '<span class="muted">—</span>' : `<div class="accbar"><div class="track"><div class="fill" style="width:${pct}%"></div></div><span class="n" style="font-family:var(--mono);font-size:12.5px">${pct}% <span class="muted">(${o.c}/${o.n})</span></span></div>`}</td>
      <td class="n">${o.started}/${o.fams}</td><td class="n">${o.fams ? o.left : '<span class="muted">none loaded</span>'}</td></tr>`; }).join("")}
    </tbody></table></div></div>`;
  }

  html += `<h2 class="sec">Question bank</h2><div class="card notice" style="padding:18px 20px">
    <p style="margin:0 0 6px">${Object.keys(BANK.byId).length} questions in ${totalFams} concepts are loaded. <b>${b.unusedQ}</b> haven't been used yet, and ${b.unstarted} concepts haven't been started.</p>
    ${b.blocked.length ? `<p style="margin:0;color:var(--bad)"><b>${b.blocked.length} concept${b.blocked.length === 1 ? " is" : "s are"} due but out of versions.</b> Ask for more questions to be loaded.</p>` : ""}
    ${b.lowFams.length ? `<p style="margin:6px 0 0" class="muted">${b.lowFams.length} started concept${b.lowFams.length === 1 ? " has" : "s have"} one or no unused versions left.</p>` : ""}
  </div>`;
  V.progress.innerHTML = html;
  drawChart();
}

function drawChart() {
  const box = $("#chartsvg"), card = $("#chart");
  const days = [];
  for (let i = 20; i >= 0; i--) { const t = Date.now() - i * DAY; days.push({ k: dayKey(t), t, n: 0, c: 0 }); }
  const idx = Object.fromEntries(days.map((d, i) => [d.k, i]));
  for (const e of LOG) { const i = idx[dayKey(e.t)]; if (i != null) { days[i].n++; if (e.ok) days[i].c++; } }
  const W = 640, H = 170, L = 30, R = 8, T = 10, B = 24;
  const max = Math.max(5, ...days.map(d => d.n));
  const step = max <= 10 ? 5 : max <= 25 ? 5 : max <= 50 ? 10 : 20;
  const top = Math.ceil(max / step) * step;
  const y = v => T + (H - T - B) * (1 - v / top);
  const bw = (W - L - R) / days.length;
  let g = "";
  for (let v = 0; v <= top; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rule)" stroke-width="1" ${v ? 'stroke-dasharray="2 3"' : ""}/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--ink-3)" font-family="var(--mono)">${v}</text>`;
  days.forEach((d, i) => {
    const x = L + i * bw + bw * 0.18, w = bw * 0.64;
    if (d.n) { const h = y(0) - y(d.n); g += `<path d="M${x} ${y(0)} V${y(d.n) + Math.min(4, h)} Q${x} ${y(d.n)} ${x + Math.min(4, w / 2)} ${y(d.n)} H${x + w - Math.min(4, w / 2)} Q${x + w} ${y(d.n)} ${x + w} ${y(d.n) + Math.min(4, h)} V${y(0)} Z" fill="var(--accent)"/>`; }
    if (i % 5 === 0 || i === days.length - 1) g += `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${i === days.length - 1 ? "Today" : new Date(d.t).toLocaleDateString([], { month: "short", day: "numeric" })}</text>`;
    g += `<rect data-i="${i}" x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}" fill="transparent"/>`;
  });
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart of questions answered per day over the last 21 days">${g}</svg>`;
  const tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true; card.appendChild(tip);
  box.querySelectorAll("rect[data-i]").forEach(r => {
    r.addEventListener("mouseenter", () => {
      const d = days[+r.dataset.i];
      tip.textContent = `${new Date(d.t).toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" })}: ${d.n} answered${d.n ? `, ${Math.round(100 * d.c / d.n)}% correct` : ""}`;
      const rb = r.getBoundingClientRect(), cb = card.getBoundingClientRect();
      tip.style.left = clamp(rb.left - cb.left + rb.width / 2, 80, cb.width - 80) + "px"; tip.style.top = (rb.top - cb.top + 10) + "px";
      tip.hidden = false;
    });
    r.addEventListener("mouseleave", () => tip.hidden = true);
  });
}

/* ------------------------------------------------------------------ */
/* Log view                                                            */
/* ------------------------------------------------------------------ */
let logFilter = "all", openRow = null;
function renderLog() {
  const rows = LOG.map((e, i) => ({ e, i })).reverse().filter(({ e }) => logFilter === "all" || (logFilter === "missed" ? !e.ok : SKILLS[e.sk] && SKILLS[e.sk][0] === logFilter));
  const RT = { guess: "Guessed", hard: "Hard", good: "Good", easy: "Easy", miss: "Didn't know how", slip: "Careless mistake" };
  V.log.innerHTML = `<div class="logtools"><h2>Practice log</h2>
    <label class="muted" for="logf" style="font-size:13px">Show</label>
    <select id="logf"><option value="all">All questions</option><option value="missed">Missed only</option>${Object.entries(DOMAINS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select></div>
    <div class="card">${rows.length ? rows.map(({ e, i }) => { const q = BANK.byId[e.q];
      return `<div class="logrow"><button data-i="${i}" aria-expanded="${openRow === i}">
        <span class="res ${e.ok ? "good" : "bad"}" aria-label="${e.ok ? "Correct" : "Missed"}">${e.ok ? CHECK : CROSS}</span>
        <span class="t1">${esc(SKILLS[e.sk] ? SKILLS[e.sk][1] : e.sk)}</span><span class="when">${fmtWhen(e.t)}</span>
        <span class="t2"><span>${esc(q ? q.source : e.q)}</span><span>${fmtSecs(e.s)}</span><span>${esc(RT[e.rt] || "")}</span><span>${esc((MODE_LABEL[e.m] || ["", ""])[1])}</span></span>
      </button>${openRow === i ? `<div class="logdetail" id="logdetail"></div>` : ""}</div>`; }).join("") : `<div class="empty">No questions answered yet. Your history will show up here.</div>`}</div>`;
  $("#logf").value = logFilter;
  $("#logf").onchange = e => { logFilter = e.target.value; openRow = null; renderLog(); };
  V.log.querySelectorAll(".logrow>button").forEach(b => b.onclick = () => { const i = +b.dataset.i; openRow = openRow === i ? null : i; renderLog(); });
  const det = $("#logdetail");
  if (det) {
    const e = LOG[openRow], q = BANK.byId[e.q];
    if (!q) { det.innerHTML = `<p class="muted">This question is no longer in the bank.</p>`; return; }
    const yours = q.type === "mc" ? `${esc(e.r)}` : esc(e.r);
    det.innerHTML = `<div class="prompt">${figureHtml(q)}${wrapTables(q.prompt)}</div>
      ${q.type === "mc" ? `<div class="expl" style="margin:8px 0">${q.choices.map((c, j) => `<div><b>${"ABCD"[j]})</b> ${c}</div>`).join("")}</div>` : ""}
      <p class="you">You answered <b>${yours}</b>. Correct answer: <b>${esc(answerText(q))}</b>.</p>
      <div class="expl">${wrapTables(q.explanation)}</div>`;
    typeset(det);
  }
}

/* ------------------------------------------------------------------ */
/* Shell                                                               */
/* ------------------------------------------------------------------ */
function show(view) {
  for (const k in V) V[k].hidden = k !== view;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === view)));
  if (view === "progress") renderProgress();
  if (view === "log") renderLog();
  if (view === "practice" && !V.practice.querySelector("#qcard") ) renderPractice();
}
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => show(b.dataset.view));

(async function boot() {
  try {
    const [st] = await Promise.all([makeStore(), loadBank()]);
    store = st;
    if (!BANK.famOrder.length) { V.practice.innerHTML = `<div class="card notice"><h2>No questions loaded</h2><p>The question bank is empty. Ask for PSAT math questions to be loaded.</p></div>`; return; }
    S = (await store.getState()) || freshState();
    S.fams = S.fams || {};
    await loadLog();
    if (store.kind === "db") setChip("", "Saved to your account");
    else setChip("local", "Saved on this device only");
    renderPractice();
  } catch (e) {
    V.practice.innerHTML = `<div class="card notice"><h2>Couldn't start</h2><p>${esc(e && e.message || e)}. Reload the page to try again.</p></div>`;
  }
})();
})();
</script>
